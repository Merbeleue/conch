      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="54" fill="url(#shell)"/>
  <rect width="240" height="240" rx="54" fill="url(#glowBlue)"/>
  <rect width="240" height="240" rx="54" fill="url(#glowAmber)"/>
  <rect x="0.75" y="0.75" width="238.5" height="238.5" rx="53.25" fill="none" stroke="#e9b98e" stroke-opacity="0.16"/>

  <g transform="translate(20 20) scale(8.3333)" fill="none" stroke="url(#spiral)" stroke-width="1.5" stroke-linecap="round" filter="url(#soft)">
    <path d="M12 3.2a8.8 8.8 0 1 0 8.8 8.8c0-3.4-2.4-5.9-5.8-5.9a4.9 4.9 0 0 0-4.9 4.9 2.9 2.9 0 0 0 2.9 2.9 1.8 1.8 0 0 0 1.8-1.8"/>
