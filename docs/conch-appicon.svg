<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Conch app icon">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111725"/>
      <stop offset="0.55" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.24" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#5678aa" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5678aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.82" cy="0.88" r="0.62">
      <stop offset="0" stop-color="#c48052" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c48052" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spiral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3cba5"/>
      <stop offset="1" stop-color="#e9b98e"/>
    </linearGradient>
    <!-- Filter effects are deliberately avoided: macOS CoreSVG, the rasteriser that
         turns this file into build/appicon.png, silently ignores <feMerge>, so a blur
         would make the SVG and the shipped icon disagree. -->
  </defs>

  <!-- macOS icon grid: an 824pt squircle centred in a 1024pt canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shell)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glowBlue)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glowAmber)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#e9b98e" stroke-opacity="0.16" stroke-width="3"/>

  <g transform="translate(168.6 168.6) scale(28.61)" fill="none" stroke="url(#spiral)" stroke-linecap="round">
    <path stroke-width="1.5" d="M12 3.2a8.8 8.8 0 1 0 8.8 8.8c0-3.4-2.4-5.9-5.8-5.9a4.9 4.9 0 0 0-4.9 4.9 2.9 2.9 0 0 0 2.9 2.9 1.8 1.8 0 0 0 1.8-1.8"/>
  </g>
</svg>
